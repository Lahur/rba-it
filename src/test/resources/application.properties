spring.application.name=rba-it

server.servlet.context-path=/api

spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

cors.allowed-origins=http://localhost:5173

spring.datasource.url=jdbc:h2:mem:rba-it-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway creates the schema; this seeds it with fixed test data on every context startup.
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:test-data.sql

kafka.topic.card-status-change=card-status-change

# Kafka is not needed for controller integration tests and there is no broker available in the test environment.
spring.autoconfigure.exclude=org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration